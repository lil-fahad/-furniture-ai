name: Furniture platform
on:
  pull_request:
    paths: ["platform/**", ".github/workflows/furniture-platform.yml"]
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/furniture-platform.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: furniture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: platform
jobs:
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: furniture_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: furniture_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U furniture_test -d furniture_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://furniture_test:isolated-ci-password@localhost:5432/furniture_test
      FURNITURE_DATABASE_URL: postgresql+psycopg://furniture_test:isolated-ci-password@localhost:5432/furniture_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: platform/requirements-test.lock}
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests migrations scripts
      - run: ruff format --check src tests migrations scripts
      - run: alembic upgrade head && alembic check
      - run: pytest -q -m "not ml"
      - run: python scripts/configure.py && docker compose config --quiet
      - run: docker build -t furniture-ai:ci .
      - run: docker run --rm furniture-ai:ci furniture --help
  training-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: platform/requirements-test.lock}
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install accelerate==1.12.0 safetensors==0.7.0 huggingface-hub==0.36.2
      - run: python -m pip install --require-hashes -r requirements-data.lock
      - run: python -m pip install transformers==4.57.6 scipy==1.18.1 sentencepiece==0.2.1 protobuf==6.33.5
      - run: pytest -q -m ml
      - run: pytest -q tests/test_dataset_importers.py
  windows-training:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      ACCELERATE_USE_CPU: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: platform/requirements-windows-ml.lock}
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --require-hashes -r requirements-windows-ml.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/windows_train.py --help
      - run: cmd /c "START-WINDOWS.cmd --help <NUL"
      - run: pytest -q -m ml
      - run: pytest -q tests/test_dataset_importers.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: platform/requirements-test.lock}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: platform/package-lock.json}
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-verification, path: platform/test-results, retention-days: 7}
